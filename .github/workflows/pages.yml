name: 部署工具页到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 发布在线工具页
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 组装站点（把 tools/ 提到站点根目录）
        run: |
          mkdir -p _site
          cp -r tools/. _site/
          # 站点首页就是工具导航页
          test -f _site/index.html && echo "首页已就位" || (echo "缺少 tools/index.html" && exit 1)

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
